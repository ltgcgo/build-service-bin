name: Build Txiki.js (saghul)

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/txiki.yml"
      - "sh/**"
      - "target/txiki.sh"

  workflow_dispatch:

  schedule:
    - cron: "30 20 * * 5"

permissions:
  contents: write
  #pages: write
  id-token: write

concurrency:
  group: "build-txiki"
  cancel-in-progress: false

jobs:
  build:
    #environment:
      #name: github-pages
      #url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      #- name: Setup Nix
        #uses: cachix/install-nix-action@v31
        #with:
          #nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest
      - name: Build for linux-amd64-gnu
        run: "bash target/txiki.sh linux Linux amd64 x86_64 gnu"
        continue-on-error: true
      - name: Build for linux-amd64-musl
        run: "bash target/txiki.sh linux Linux amd64 x86_64 musl"
        continue-on-error: true
      - name: Build for linux-arm64-gnu
        run: "bash target/txiki.sh linux Linux arm64 aarch64 gnu"
        continue-on-error: true
      - name: Build for linux-arm64-musl
        run: "bash target/txiki.sh linux Linux arm64 aarch64 musl"
        continue-on-error: true
      - name: Build for windows-amd64-gnu
        run: "bash target/txiki.sh windows Windows amd64 x86_64 gnu"
        continue-on-error: true
      - name: Build for windows-arm64-gnu
        run: "bash target/txiki.sh windows Windows arm64 aarch64 gnu"
        continue-on-error: true
      - name: Finalise built artefacts
        run: "./shx post"
      - name: Update the release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: "build/*"
          allowUpdates: true
          artifactErrorsFailBuild: true
          makeLatest: false
          prerelease: true
          removeArtifacts: true
          replacesArtifacts: true
          name: "Txiki.js (saghul)"
          tag: "build-txiki"
      - name: Prevent retracted GitHub releases
        run: git push --force origin "$GITHUB_SHA:refs/heads/build-txiki" "$GITHUB_SHA:refs/tags/build-txiki"